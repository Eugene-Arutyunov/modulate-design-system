{% extends 'service/layout.html' %} {% set pageTitle = 'Icon Studio' %} {%
block content %}

<main class="m__wrapper icon-studio">
  <div class="m__space XL"></div>

  <h1>Icon Studio</h1>

  <div class="m__space S"></div>

  <section class="icon-studio__panel" aria-label="Studio controls">
    <div class="icon-studio__grid">
      <fieldset>
        <legend>
          Icon
          <button
            class="icon-studio__reset"
            type="button"
            data-icon-studio-reset="icon"
            hidden>
            Reset
          </button>
        </legend>
        <div class="icon-studio__row">
          <span>Icon</span>
          <details class="icon-studio__dropdown" data-icon-studio-icon-dropdown>
            <summary>
              <svg viewBox="0 0 32 32" aria-hidden="true">
                <use data-icon-studio-icon-use href="#velma"></use>
              </svg>
              <span data-icon-studio-icon-name>Velma</span>
            </summary>
            <div class="icon-studio__dropdown-list">
              <button type="button" data-icon-studio-icon-option="velma">
                <svg viewBox="0 0 32 32" aria-hidden="true">
                  <use href="#velma"></use>
                </svg>
                <span>Velma</span>
              </button>
              <button type="button" data-icon-studio-icon-option="transcript">
                <svg viewBox="0 0 32 32" aria-hidden="true">
                  <use href="#transcript"></use>
                </svg>
                <span>Transcription</span>
              </button>
              <button type="button" data-icon-studio-icon-option="deepfake">
                <svg viewBox="0 0 32 32" aria-hidden="true">
                  <use href="#deepfake"></use>
                </svg>
                <span>Deepfake Detection</span>
              </button>
              <button type="button" data-icon-studio-icon-option="redaction">
                <svg viewBox="0 0 32 32" aria-hidden="true">
                  <use href="#redaction"></use>
                </svg>
                <span>PII/PHI Redaction</span>
              </button>
              <button type="button" data-icon-studio-icon-option="music">
                <svg viewBox="0 0 32 32" aria-hidden="true">
                  <use href="#music"></use>
                </svg>
                <span>Music &amp; Speech Detection</span>
              </button>
              <button type="button" data-icon-studio-icon-option="stt-med">
                <svg viewBox="0 0 32 32" aria-hidden="true">
                  <use href="#stt-med"></use>
                </svg>
                <span>Medical Transcription</span>
              </button>
              <button type="button" data-icon-studio-icon-option="ai-music">
                <svg viewBox="0 0 32 32" aria-hidden="true">
                  <use href="#ai-music"></use>
                </svg>
                <span>AI Music Detection</span>
              </button>
              <button type="button" data-icon-studio-icon-option="language">
                <svg viewBox="0 0 32 32" aria-hidden="true">
                  <use href="#language"></use>
                </svg>
                <span>Language Detection</span>
              </button>
              <button type="button" data-icon-studio-icon-option="accent">
                <svg viewBox="0 0 32 32" aria-hidden="true">
                  <use href="#accent"></use>
                </svg>
                <span>Accent Identification</span>
              </button>
              <button type="button" data-icon-studio-icon-option="emotions">
                <svg viewBox="0 0 32 32" aria-hidden="true">
                  <use href="#emotions"></use>
                </svg>
                <span>Emotion Detection</span>
              </button>
              <button type="button" data-icon-studio-icon-option="voice-match">
                <svg viewBox="0 0 32 32" aria-hidden="true">
                  <use href="#voice-match"></use>
                </svg>
                <span>Voice Match</span>
              </button>
            </div>
          </details>
        </div>
        <label>
          Size
          <input
            data-icon-studio="size"
            type="range"
            min="0.4"
            max="2"
            step="0.01" />
          <output></output>
        </label>
        <label>
          Position
          <input
            data-icon-studio="position"
            type="range"
            min="0"
            max="100"
            step="0.5" />
          <output></output>
        </label>
        <label>
          Rotation X
          <input
            data-icon-studio="rotation.x"
            type="range"
            min="-2"
            max="2"
            step="0.01" />
          <output></output>
        </label>
        <label>
          Rotation Y
          <input
            data-icon-studio="rotation.y"
            type="range"
            min="-2"
            max="2"
            step="0.01" />
          <output></output>
        </label>
        <label>
          Rotation Z
          <input
            data-icon-studio="rotation.z"
            type="range"
            min="-2"
            max="2"
            step="0.01" />
          <output></output>
        </label>
        <label>
          Shadow
          <input
            data-icon-studio="shadowOpacity"
            type="range"
            min="0"
            max="0.25"
            step="0.01" />
          <output></output>
        </label>
        <label>
          Color bleed
          <input
            data-icon-studio="colorBleed"
            type="range"
            min="0"
            max="0.5"
            step="0.02" />
          <output></output>
        </label>
      </fieldset>

      <fieldset>
        <legend>
          Light
          <button
            class="icon-studio__reset"
            type="button"
            data-icon-studio-reset="light"
            hidden>
            Reset
          </button>
        </legend>
        <label>
          Key
          <input
            data-icon-studio="light.keyIntensity"
            type="range"
            min="0"
            max="3"
            step="0.01" />
          <output></output>
        </label>
        <label>
          Ambient
          <input
            data-icon-studio="light.ambientIntensity"
            type="range"
            min="0"
            max="2.5"
            step="0.02" />
          <output></output>
        </label>
        <div class="icon-studio__light-pad" data-icon-studio-light-pad>
          <span class="icon-studio__light-knob"></span>
          <input
            class="icon-studio__light-z"
            data-icon-studio="light.z"
            type="range"
            min="-100"
            max="240"
            step="1"
            aria-label="Light Z" />
        </div>
        <output
          class="icon-studio__light-output"
          data-icon-studio-light-output></output>
      </fieldset>

      <div class="icon-studio__col">
        <fieldset>
          <legend>
            Stage
            <button
              class="icon-studio__reset"
              type="button"
              data-icon-studio-reset="stage"
              hidden>
              Reset
            </button>
          </legend>
          <label>
            Aspect
            <input
              data-icon-studio="stage.aspect"
              type="range"
              min="1.25"
              max="2"
              step="0.01" />
            <output></output>
          </label>
          <div class="icon-studio__row">
            <span>Background</span>
            <details class="icon-studio__palette" data-icon-studio-palette>
              <summary>
                <span
                  class="icon-studio__swatch"
                  data-icon-studio-bg-swatch></span>
                <span data-icon-studio-bg-name></span>
              </summary>
              <div class="icon-studio__palette-grid"></div>
            </details>
          </div>
        </fieldset>

        <fieldset>
          <legend>
            Animation
            <button
              class="icon-studio__reset"
              type="button"
              data-icon-studio-reset="animation"
              hidden>
              Reset
            </button>
          </legend>
          <div class="icon-studio__row">
            <span>Preset</span>
            <div
              class="m__segmented-control-secondary icon-studio__anim-preset">
              <label>
                <input
                  type="radio"
                  name="icon-studio-anim-preset"
                  value="off"
                  data-icon-studio-anim-preset
                  checked />
                Off
              </label>
              <label>
                <input
                  type="radio"
                  name="icon-studio-anim-preset"
                  value="x"
                  data-icon-studio-anim-preset />
                X
              </label>
              <label>
                <input
                  type="radio"
                  name="icon-studio-anim-preset"
                  value="y"
                  data-icon-studio-anim-preset />
                Y
              </label>
            </div>
          </div>
          <label>
            Amplitude
            <input
              data-icon-studio="animation.amplitude"
              type="range"
              min="0"
              max="1"
              step="0.01" />
            <output></output>
          </label>
          <label>
            Speed
            <input
              data-icon-studio="animation.speed"
              type="range"
              min="0.05"
              max="0.5"
              step="0.01" />
            <output></output>
          </label>
          <label class="icon-studio__check">
            <input data-icon-studio-anim-pause type="checkbox" />
            Pause
          </label>
        </fieldset>
      </div>
    </div>
  </section>

  <div class="m__space S"></div>

  <!-- Move the cursor over the stage to orbit the icon; click to capture the
       pose as the new base rotation (tracking resumes after the pointer
       leaves the stage). -->
  <div class="icon-studio__stage" data-icon-studio-stage></div>

  <div class="m__space XL"></div>
</main>

{% include 'service/icon-3d-importmap.html' %}
<script type="module" src="/assets/service/icon-3d/icon-studio.js"></script>

{% endblock %}
