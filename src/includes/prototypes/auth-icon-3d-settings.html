<section
  class="icon-3d-settings icon-3d-settings--left m__rounded"
  aria-label="3D icon stack settings">
  <div class="icon-3d-settings__grid">
    <fieldset class="icon-3d-settings__icons">
      <legend>Icons</legend>
      <label class="icon-3d-settings__icon-toggle">
        <input type="checkbox" data-model-icon-3d-icon="velma" checked />
        Velma
      </label>
      <label class="icon-3d-settings__icon-toggle">
        <input
          type="checkbox"
          data-model-icon-3d-icon="transcription"
          checked />
        Transcription
      </label>
      <label class="icon-3d-settings__icon-toggle">
        <input
          type="checkbox"
          data-model-icon-3d-icon="deepfake-detection"
          checked />
        Deepfake Detection
      </label>
      <label class="icon-3d-settings__icon-toggle">
        <input
          type="checkbox"
          data-model-icon-3d-icon="pii-phi-redaction"
          checked />
        PII/PHI Redaction
      </label>
      <label class="icon-3d-settings__icon-toggle">
        <input
          type="checkbox"
          data-model-icon-3d-icon="music-speech-detection"
          checked />
        Music &amp; Speech Detection
      </label>
      <label class="icon-3d-settings__icon-toggle">
        <input
          type="checkbox"
          data-model-icon-3d-icon="speech-to-text"
          checked />
        Medical Transcription
      </label>
      <label class="icon-3d-settings__icon-toggle">
        <input type="checkbox" data-model-icon-3d-icon="ai-music" />
        AI Music Detection
      </label>
      <label class="icon-3d-settings__icon-toggle">
        <input type="checkbox" data-model-icon-3d-icon="language" />
        Language Detection
      </label>
      <label class="icon-3d-settings__icon-toggle">
        <input
          type="checkbox"
          data-model-icon-3d-icon="emotion-detection"
          checked />
        Emotion Detection
      </label>
      <label class="icon-3d-settings__icon-toggle">
        <input
          type="checkbox"
          data-model-icon-3d-icon="accent-identification"
          checked />
        Accent Identification
      </label>
      <label class="icon-3d-settings__icon-toggle">
        <input type="checkbox" data-model-icon-3d-icon="voice-match" checked />
        Voice Match
      </label>
    </fieldset>

    <div class="icon-3d-settings__col">
      <fieldset>
        <legend>Auth Tile</legend>
        <button
          class="icon-3d-settings__reset"
          type="button"
          data-model-icon-3d-reset="authTile">
          Reset
        </button>
        <label>
          Depth
          <input
            data-model-icon-3d-setting="authTile.depth"
            type="range"
            min="0.5"
            max="12"
            step="0.1" />
          <output></output>
        </label>
        <label>
          Bevel thickness
          <input
            data-model-icon-3d-setting="authTile.bevelThickness"
            type="range"
            min="0"
            max="1.5"
            step="0.05" />
          <output></output>
        </label>
        <label>
          Bevel size
          <input
            data-model-icon-3d-setting="authTile.bevelSize"
            type="range"
            min="0"
            max="1.5"
            step="0.05" />
          <output></output>
        </label>
        <label>
          Roughness
          <input
            data-model-icon-3d-setting="authTile.roughness"
            type="range"
            min="0"
            max="1"
            step="0.01" />
          <output></output>
        </label>
        <label>
          Clearcoat
          <input
            data-model-icon-3d-setting="authTile.clearcoat"
            type="range"
            min="0"
            max="1"
            step="0.01" />
          <output></output>
        </label>
        <label>
          Clearcoat roughness
          <input
            data-model-icon-3d-setting="authTile.clearcoatRoughness"
            type="range"
            min="0"
            max="1"
            step="0.01" />
          <output></output>
        </label>
      </fieldset>

      <fieldset>
        <legend>Auth Shadow</legend>
        <button
          class="icon-3d-settings__reset"
          type="button"
          data-model-icon-3d-reset="authShadow authReflection">
          Reset
        </button>
        <label>
          Blur
          <input
            data-model-icon-3d-setting="authShadow.blur"
            type="range"
            min="0"
            max="3"
            step="0.05" />
          <output></output>
        </label>
        <label>
          Tint
          <input
            data-model-icon-3d-setting="authShadow.tint"
            type="range"
            min="0"
            max="2"
            step="0.05" />
          <output></output>
        </label>
        <label>
          Bleed
          <input
            data-model-icon-3d-setting="authShadow.bleed"
            type="range"
            min="0"
            max="2"
            step="0.05" />
          <output></output>
        </label>
        <label>
          Opacity
          <input
            data-model-icon-3d-setting="authShadow.opacity"
            type="range"
            min="0"
            max="0.5"
            step="0.01" />
          <output></output>
        </label>
        <label>
          Reflection env
          <input
            data-model-icon-3d-setting="authReflection.envMapIntensity"
            type="range"
            min="0"
            max="1"
            step="0.01" />
          <output></output>
        </label>
      </fieldset>

      <fieldset>
        <legend>Auth Light</legend>
        <button
          class="icon-3d-settings__reset"
          type="button"
          data-model-icon-3d-reset="light.auth">
          Reset
        </button>
        <label>
          Key
          <input
            data-model-icon-3d-setting="light.auth.keyIntensity"
            type="range"
            min="0"
            max="2"
            step="0.01" />
          <output></output>
        </label>
        <label>
          Ambient
          <input
            data-model-icon-3d-setting="light.auth.ambientIntensity"
            type="range"
            min="0"
            max="6"
            step="0.02" />
          <output></output>
        </label>
        <label>
          Angle
          <input
            data-model-icon-3d-setting="light.auth.angle"
            type="range"
            min="-120"
            max="120"
            step="1" />
          <output></output>
        </label>
        <label>
          Y
          <input
            data-model-icon-3d-setting="light.auth.y"
            type="range"
            min="-200"
            max="240"
            step="1" />
          <output></output>
        </label>
        <label>
          Z
          <input
            data-model-icon-3d-setting="light.auth.z"
            type="range"
            min="-100"
            max="240"
            step="1" />
          <output></output>
        </label>
      </fieldset>
    </div>

    <div class="icon-3d-settings__col">
      <fieldset>
        <legend>Auth Glyph</legend>
        <button
          class="icon-3d-settings__reset"
          type="button"
          data-model-icon-3d-reset="authGlyph">
          Reset
        </button>
        <label>
          Depth
          <input
            data-model-icon-3d-setting="authGlyph.depth"
            type="range"
            min="0.5"
            max="8"
            step="0.1" />
          <output></output>
        </label>
        <label>
          Bevel
          <input
            data-model-icon-3d-setting="authGlyph.bevel"
            type="range"
            min="0"
            max="1"
            step="0.05" />
          <output></output>
        </label>
        <label>
          Lift
          <input
            data-model-icon-3d-setting="authGlyph.lift"
            type="range"
            min="0"
            max="2"
            step="0.05" />
          <output></output>
        </label>
        <label>
          Roughness
          <input
            data-model-icon-3d-setting="authGlyph.roughness"
            type="range"
            min="0"
            max="1"
            step="0.01" />
          <output></output>
        </label>
        <label>
          Clearcoat
          <input
            data-model-icon-3d-setting="authGlyph.clearcoat"
            type="range"
            min="0"
            max="1"
            step="0.01" />
          <output></output>
        </label>
        <label>
          Clearcoat roughness
          <input
            data-model-icon-3d-setting="authGlyph.clearcoatRoughness"
            type="range"
            min="0"
            max="1"
            step="0.01" />
          <output></output>
        </label>
      </fieldset>

      <fieldset>
        <legend>Auth View</legend>
        <button
          class="icon-3d-settings__reset"
          type="button"
          data-model-icon-3d-reset="view.auth">
          Reset
        </button>
        <label>
          Auth scale
          <input
            data-model-icon-3d-setting="view.auth.scale"
            type="range"
            min="0.5"
            max="1.8"
            step="0.01" />
          <output></output>
        </label>
        <label>
          Scene zoom
          <input
            data-model-icon-3d-setting="view.auth.zoom"
            type="range"
            min="0.5"
            max="1.5"
            step="0.005" />
          <output></output>
        </label>
        <label>
          Auth active lift
          <input
            data-model-icon-3d-setting="view.auth.activeLift"
            type="range"
            min="0"
            max="32"
            step="0.5" />
          <output></output>
        </label>
        <label>
          Auth active scale
          <input
            data-model-icon-3d-setting="view.auth.activeScale"
            type="range"
            min="0.8"
            max="1.4"
            step="0.01" />
          <output></output>
        </label>
        <label>
          Auth base X
          <input
            data-model-icon-3d-setting="view.auth.baseRotation.x"
            type="range"
            min="-2"
            max="2"
            step="0.01" />
          <output></output>
        </label>
        <label>
          Auth base Y
          <input
            data-model-icon-3d-setting="view.auth.baseRotation.y"
            type="range"
            min="-2"
            max="2"
            step="0.01" />
          <output></output>
        </label>
        <label>
          Auth base Z
          <input
            data-model-icon-3d-setting="view.auth.baseRotation.z"
            type="range"
            min="-2"
            max="2"
            step="0.01" />
          <output></output>
        </label>
        <label>
          Auth active X
          <input
            data-model-icon-3d-setting="view.auth.activeRotation.x"
            type="range"
            min="-2"
            max="2"
            step="0.01" />
          <output></output>
        </label>
        <label>
          Auth active Y
          <input
            data-model-icon-3d-setting="view.auth.activeRotation.y"
            type="range"
            min="-2"
            max="2"
            step="0.01" />
          <output></output>
        </label>
        <label>
          Auth active Z
          <input
            data-model-icon-3d-setting="view.auth.activeRotation.z"
            type="range"
            min="-2"
            max="2"
            step="0.01" />
          <output></output>
        </label>
      </fieldset>
    </div>
  </div>
</section>
