<div class="prototype-banner" data-prototype-banner hidden>
  <span class="prototype-banner__text"
    >This is a design prototype — the real product lives at
    <a href="https://platform.modulate.ai">platform.modulate.ai</a></span
  >
  <button
    type="button"
    class="prototype-banner__close"
    aria-label="Dismiss the prototype notice"
  >
    ×
  </button>
</div>
<script>
  // Runs inline so the banner state is settled before first paint;
  // dismissal persists in localStorage across all prototype pages.
  (function () {
    var KEY = "prototype-banner-dismissed";
    var banner = document.querySelector("[data-prototype-banner]");
    if (!banner) return;
    try {
      if (localStorage.getItem(KEY) === "1") return;
    } catch (e) {
      /* ignore */
    }
    banner.hidden = false;
    banner
      .querySelector(".prototype-banner__close")
      .addEventListener("click", function () {
        banner.hidden = true;
        try {
          localStorage.setItem(KEY, "1");
        } catch (e) {
          /* ignore */
        }
      });
  })();
</script>
