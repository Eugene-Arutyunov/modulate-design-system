<div class="m__sequence M" style="margin-bottom: 0">
  <!-- neutral -->
  <div class="m__sequence-item">
    <div
      class="guide-color-plate guide-color-plate--emotions"
      style="
        background-color: var(--emotion-neutral);
        color: var(--m__text-inverted);
      ">
      <p>emotion-neutral</p>
      <p class="guide-color-plate__emotions">neutral</p>
      <button class="guide-color-plate__value"></button>
    </div>
  </div>

  <!-- attack / rejection -->
  <div class="m__sequence-item">
    <div
      class="guide-color-plate guide-color-plate--emotions"
      style="
        background-color: var(--emotion-angry);
        color: var(--m__text-inverted);
      ">
      <p>emotion-angry</p>
      <p class="guide-color-plate__emotions">angry, disgusted</p>
      <button class="guide-color-plate__value"></button>
    </div>
  </div>

  <!-- threat / uncertainty -->
  <div class="m__sequence-item">
    <div
      class="guide-color-plate guide-color-plate--emotions"
      style="
        background-color: var(--emotion-afraid);
        color: var(--m__text-inverted);
      ">
      <p>emotion-afraid</p>
      <p class="guide-color-plate__emotions">afraid, surprised</p>
      <button class="guide-color-plate__value"></button>
    </div>
  </div>

  <!-- excited / engaged -->
  <div class="m__sequence-item">
    <div
      class="guide-color-plate guide-color-plate--emotions"
      style="
        background-color: var(--emotion-happy);
        color: var(--m__text-inverted);
      ">
      <p>emotion-happy</p>
      <p class="guide-color-plate__emotions">happy</p>
      <button class="guide-color-plate__value"></button>
    </div>
  </div>

  <!-- low energy, negative -->
  <div class="m__sequence-item">
    <div
      class="guide-color-plate guide-color-plate--emotions"
      style="
        background-color: var(--emotion-sad);
        color: var(--m__text-inverted);
      ">
      <p>emotion-sad</p>
      <p class="guide-color-plate__emotions">sad</p>
      <button class="guide-color-plate__value"></button>
    </div>
  </div>

  <!-- no signal -->
  <div class="m__sequence-item">
    <div
      class="guide-color-plate guide-color-plate--emotions"
      style="
        background-color: var(--emotion-other);
        color: var(--m__text-inverted);
      ">
      <p>emotion-other</p>
      <p class="guide-color-plate__emotions">other, unknown</p>
      <button class="guide-color-plate__value"></button>
    </div>
  </div>
</div>
