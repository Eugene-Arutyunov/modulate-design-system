  <a href="/design-system/" class="nav-island__link">Design System</a>

  {% if islandThemeToggle %}
  <button
    type="button"
    class="theme-toggle nav-island__theme-toggle"
    role="switch"
    aria-checked="false"
    aria-label="Dark theme">
    <span class="theme-toggle__track">
      <span class="theme-toggle__thumb"></span>
    </span>
  </button>

<script>
  // Restores the island before first paint; the key matches nav-island.js.
  (function () {
    try {
      if (sessionStorage.getItem("nav-island-open") === "1") {
        document.querySelector(".nav-island").classList.add("is-open");
      }
    } catch (e) {}
  })();
</script>
