<div class="m__space L"></div>
<figure class="proximity-grid-figure">
  <div
    class="m__sequence XL gap-L"
    role="group"
    aria-label="Even spacing versus grouped spacing in a product grid"
  >
    <div class="m__sequence-item">
      <p class="proximity-grid-figure__title">Even spacing</p>
      <div class="proximity-grid-figure__frame m__rounded">
        <svg viewBox="0 0 390 340" xmlns="http://www.w3.org/2000/svg" role="img">
          <title>
            Even spacing: the gap above each caption equals the gap below it, so
            it is ambiguous whether a price belongs to the product above or the
            row below
          </title>
          <rect
            class="pxg-shot"
            x="30"
            y="20"
            width="130"
            height="120"
            rx="4"
          />
          <path
            d="M72.0,33.0 H118.0 V127.0 H98.7 L95.0,72.5 L91.3,127.0 H72.0 Z"
            fill="#26364f"
          />
          <text class="pxg-name" x="30" y="173">Northbound</text>
          <text class="pxg-cat" x="30" y="190">Slim jeans</text>
          <text class="pxg-price" x="30" y="208">$129</text>
          <rect
            class="pxg-shot"
            x="180"
            y="20"
            width="130"
            height="120"
            rx="4"
          />
          <path
            d="M222.0,33.0 H268.0 V127.0 H248.7 L245.0,72.5 L241.3,127.0 H222.0 Z"
            fill="#7d9ac6"
          />
          <text class="pxg-name" x="180" y="173">Halden</text>
          <text class="pxg-cat" x="180" y="190">Straight jeans</text>
          <text class="pxg-price" x="180" y="208">$95</text>
          <rect
            class="pxg-shot"
            x="30"
            y="230"
            width="130"
            height="120"
            rx="4"
          />
          <path
            d="M72.0,243.0 H118.0 V337.0 H98.7 L95.0,282.5 L91.3,337.0 H72.0 Z"
            fill="#4a6285"
          />
          <rect
            class="pxg-shot"
            x="180"
            y="230"
            width="130"
            height="120"
            rx="4"
          />
          <path
            d="M222.0,243.0 H268.0 V337.0 H248.7 L245.0,282.5 L241.3,337.0 H222.0 Z"
            fill="#1b1b21"
          />
          <g class="pxg-mark"><path d="M356,140h10M356,160h10M361,140v20" /></g>
          <text class="pxg-num" x="374" y="154">20</text>
          <g class="pxg-mark"><path d="M356,210h10M356,230h10M361,210v20" /></g>
          <text class="pxg-num" x="374" y="224">20</text>
        </svg>
      </div>
      <p class="caption">
        The block of text sits exactly between two rows. Does “$129” belong to
        the jeans above it, or the ones below? You have to check.
      </p>
    </div>
    <div class="m__sequence-item">
      <p class="proximity-grid-figure__title">Grouped spacing</p>
      <div class="proximity-grid-figure__frame m__rounded">
        <svg viewBox="0 0 390 340" xmlns="http://www.w3.org/2000/svg" role="img">
          <title>
            Grouped spacing: the caption sits 8 pixels below its own image and 46
            pixels above the next row, making the pairing obvious
          </title>
          <rect
            class="pxg-shot"
            x="30"
            y="20"
            width="130"
            height="120"
            rx="4"
          />
          <path
            d="M72.0,33.0 H118.0 V127.0 H98.7 L95.0,72.5 L91.3,127.0 H72.0 Z"
            fill="#26364f"
          />
          <text class="pxg-name" x="30" y="161">Northbound</text>
          <text class="pxg-cat" x="30" y="178">Slim jeans</text>
          <text class="pxg-price" x="30" y="196">$129</text>
          <rect
            class="pxg-shot"
            x="180"
            y="20"
            width="130"
            height="120"
            rx="4"
          />
          <path
            d="M222.0,33.0 H268.0 V127.0 H248.7 L245.0,72.5 L241.3,127.0 H222.0 Z"
            fill="#7d9ac6"
          />
          <text class="pxg-name" x="180" y="161">Halden</text>
          <text class="pxg-cat" x="180" y="178">Straight jeans</text>
          <text class="pxg-price" x="180" y="196">$95</text>
          <rect
            class="pxg-shot"
            x="30"
            y="244"
            width="130"
            height="120"
            rx="4"
          />
          <path
            d="M72.0,257.0 H118.0 V351.0 H98.7 L95.0,296.5 L91.3,351.0 H72.0 Z"
            fill="#4a6285"
          />
          <rect
            class="pxg-shot"
            x="180"
            y="244"
            width="130"
            height="120"
            rx="4"
          />
          <path
            d="M222.0,257.0 H268.0 V351.0 H248.7 L245.0,296.5 L241.3,351.0 H222.0 Z"
            fill="#1b1b21"
          />
          <g class="pxg-mark"><path d="M356,140h10M356,148h10M361,140v8" /></g>
          <text class="pxg-num" x="374" y="148">8</text>
          <g class="pxg-mark"><path d="M356,198h10M356,244h10M361,198v46" /></g>
          <text class="pxg-num" x="374" y="225">46</text>
        </svg>
      </div>
      <p class="caption">
        Nothing moved but the whitespace. The caption is now visibly attached to
        its own product, and the row below is visibly separate.
      </p>
    </div>
  </div>
</figure>
<div class="m__space XL"></div>
