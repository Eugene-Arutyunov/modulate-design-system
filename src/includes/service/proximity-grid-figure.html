<figure class="proximity-grid-figure">
  <div
    class="proximity-grid-figure__panels"
    role="group"
    aria-label="Even spacing versus grouped spacing in a product grid"
  >
    <svg viewBox="0 0 428 500" xmlns="http://www.w3.org/2000/svg" role="img">
      <title>
        Even spacing: the gap above each caption equals the gap below it, so it
        is ambiguous whether a price belongs to the product above or the row
        below
      </title>
      <text class="pxg-title" x="20" y="34">Even spacing</text>
      <rect class="pxg-card" x="20" y="56" width="340" height="340" rx="10" />
      <clipPath id="pxg-clip-0">
        <rect x="20" y="56" width="340" height="340" rx="10" />
      </clipPath>
      <g clip-path="url(#pxg-clip-0)">
        <rect class="pxg-shot" x="50" y="76" width="130" height="120" rx="4" />
        <path
          d="M92.0,89.0 H138.0 V183.0 H118.7 L115.0,128.5 L111.3,183.0 H92.0 Z"
          fill="#26364f"
        />
        <text class="pxg-name" x="50" y="229">Northbound</text>
        <text class="pxg-cat" x="50" y="246">Slim jeans</text>
        <text class="pxg-price" x="50" y="264">$129</text>
        <rect class="pxg-shot" x="200" y="76" width="130" height="120" rx="4" />
        <path
          d="M242.0,89.0 H288.0 V183.0 H268.7 L265.0,128.5 L261.3,183.0 H242.0 Z"
          fill="#7d9ac6"
        />
        <text class="pxg-name" x="200" y="229">Halden</text>
        <text class="pxg-cat" x="200" y="246">Straight jeans</text>
        <text class="pxg-price" x="200" y="264">$95</text>
        <rect class="pxg-shot" x="50" y="286" width="130" height="120" rx="4" />
        <path
          d="M92.0,299.0 H138.0 V393.0 H118.7 L115.0,338.5 L111.3,393.0 H92.0 Z"
          fill="#4a6285"
        />
        <rect
          class="pxg-shot"
          x="200"
          y="286"
          width="130"
          height="120"
          rx="4"
        />
        <path
          d="M242.0,299.0 H288.0 V393.0 H268.7 L265.0,338.5 L261.3,393.0 H242.0 Z"
          fill="#1b1b21"
        />
      </g>
      <g class="pxg-mark"><path d="M376,196h10M376,216h10M381,196v20" /></g>
      <text class="pxg-num" x="394" y="210.0">20</text>
      <g class="pxg-mark"><path d="M376,266h10M376,286h10M381,266v20" /></g>
      <text class="pxg-num" x="394" y="280.0">20</text>
      <text class="pxg-cap" x="20" y="432">
        The block of text sits exactly between two rows.
      </text>
      <text class="pxg-cap" x="20" y="454">
        Does &#8220;$129&#8221; belong to the jeans above it,
      </text>
      <text class="pxg-cap" x="20" y="476">
        or the ones below? You have to check.
      </text>
    </svg>
    <svg viewBox="440 0 428 500" xmlns="http://www.w3.org/2000/svg" role="img">
      <title>
        Grouped spacing: the caption sits 8 pixels below its own image and 46
        pixels above the next row, making the pairing obvious
      </title>
      <text class="pxg-title" x="460" y="34">Grouped spacing</text>
      <rect class="pxg-card" x="460" y="56" width="340" height="340" rx="10" />
      <clipPath id="pxg-clip-1">
        <rect x="460" y="56" width="340" height="340" rx="10" />
      </clipPath>
      <g clip-path="url(#pxg-clip-1)">
        <rect class="pxg-shot" x="490" y="76" width="130" height="120" rx="4" />
        <path
          d="M532.0,89.0 H578.0 V183.0 H558.7 L555.0,128.5 L551.3,183.0 H532.0 Z"
          fill="#26364f"
        />
        <text class="pxg-name" x="490" y="217">Northbound</text>
        <text class="pxg-cat" x="490" y="234">Slim jeans</text>
        <text class="pxg-price" x="490" y="252">$129</text>
        <rect class="pxg-shot" x="640" y="76" width="130" height="120" rx="4" />
        <path
          d="M682.0,89.0 H728.0 V183.0 H708.7 L705.0,128.5 L701.3,183.0 H682.0 Z"
          fill="#7d9ac6"
        />
        <text class="pxg-name" x="640" y="217">Halden</text>
        <text class="pxg-cat" x="640" y="234">Straight jeans</text>
        <text class="pxg-price" x="640" y="252">$95</text>
        <rect
          class="pxg-shot"
          x="490"
          y="300"
          width="130"
          height="120"
          rx="4"
        />
        <path
          d="M532.0,313.0 H578.0 V407.0 H558.7 L555.0,352.5 L551.3,407.0 H532.0 Z"
          fill="#4a6285"
        />
        <rect
          class="pxg-shot"
          x="640"
          y="300"
          width="130"
          height="120"
          rx="4"
        />
        <path
          d="M682.0,313.0 H728.0 V407.0 H708.7 L705.0,352.5 L701.3,407.0 H682.0 Z"
          fill="#1b1b21"
        />
      </g>
      <g class="pxg-mark"><path d="M816,196h10M816,204h10M821,196v8" /></g>
      <text class="pxg-num" x="834" y="204.0">8</text>
      <g class="pxg-mark"><path d="M816,254h10M816,300h10M821,254v46" /></g>
      <text class="pxg-num" x="834" y="281.0">46</text>
      <text class="pxg-cap" x="460" y="432">
        Nothing moved but the whitespace. The caption
      </text>
      <text class="pxg-cap" x="460" y="454">
        is now visibly attached to its own product,
      </text>
      <text class="pxg-cap" x="460" y="476">
        and the row below is visibly separate.
      </text>
    </svg>
  </div>
</figure>
